name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-3-dev libatspi2.0-dev libasound2-dev libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build --verbose

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Build .deb package
        run: |
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications
          cp target/release/voicetype deb/usr/bin/voicetype
          chmod 755 deb/usr/bin/voicetype
          cat > deb/usr/share/applications/voicetype.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=VoiceType
          Comment=Voice dictation for Linux Mint
          Exec=/usr/bin/voicetype
          Icon=audio-input-microphone
          Terminal=false
          Categories=Utility;Accessibility;
          DESKTOP
          cat > deb/DEBIAN/control <<'EOF'
          Package: voicetype
          Version: 0.1.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libatspi2.0-0, libasound2, libx11-6, xdotool, zenity
          Maintainer: raihanetx
          Description: Voice dictation for Linux Mint (Cinnamon)
           Speak instead of type.
          EOF
          dpkg-deb --build deb voicetype_0.1.0_amd64.deb

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: voicetype-linux
          path: target/release/voicetype

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: voicetype-deb
          path: voicetype_0.1.0_amd64.deb
